<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mi Música — Reproductor Offline</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mi Música">
    <meta name="theme-color" content="#0b0918">
    <style>
        /* RESET Y BASE */
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        :root {
            --primary: #7C4DFF;
            --primary-dark: #5B2FD1;
            --primary-light: #A78BFA;
            --secondary: #FF6B8B;
            --accent: #FFC857;
            --accent-2: #4FD1C5;
            --bg-start: #0b0918;
            --bg-mid: #1a1440;
            --bg-end: #140f2e;
            --text-primary: #FFFFFF;
            --text-secondary: #9C97B8;
            --card-bg: rgba(255,255,255,0.055);
            --card-bg-strong: rgba(255,255,255,0.09);
            --glass-border: rgba(255,255,255,0.09);
            --radius: 26px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }
        html, body { height:100%; height:100dvh; overflow:hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: radial-gradient(circle at 15% 8%, rgba(124,77,255,0.25), transparent 45%),
                        radial-gradient(circle at 85% 92%, rgba(79,209,197,0.14), transparent 40%),
                        linear-gradient(160deg, var(--bg-start), var(--bg-mid) 55%, var(--bg-end));
            display:flex; justify-content:center; align-items:center; color:var(--text-primary);
            overflow:hidden; position:relative;
        }
        svg.icon { width:1em; height:1em; display:block; flex-shrink:0; }
        .icon-filled { fill:currentColor; }

        /* OFFLINE BADGE */
        .offline-badge {
            position:fixed; top:0; left:0; right:0;
            background:linear-gradient(90deg,#FF6B8B,#FF9166); color:white; text-align:center;
            padding:6px 12px; font-size:11px; font-weight:600; letter-spacing:0.2px;
            z-index:9999; display:flex; align-items:center; justify-content:center; gap:6px;
            transform:translateY(-100%); transition:transform 0.45s var(--ease-spring);
        }
        .offline-badge.show { transform:translateY(0); }
        .offline-badge svg { width:13px; height:13px; }

        /* CONTENEDOR PRINCIPAL */
        .player-container {
            width:100%; height:100%; height:100dvh; max-width:480px;
            padding:20px 20px calc(20px + var(--safe-bottom));
            display:flex; flex-direction:column; justify-content:space-between;
            background:var(--card-bg); backdrop-filter:blur(24px);
            -webkit-backdrop-filter:blur(24px);
            border:1px solid var(--glass-border);
            position:relative; overflow:hidden;
            animation:fadeInUp 0.7s var(--ease-smooth);
        }
        @keyframes fadeInUp { from{opacity:0;transform:translateY(24px);} to{opacity:1;transform:translateY(0);} }
        .player-container::before {
            content:''; position:absolute; top:-2px; left:-2px; right:-2px; bottom:-2px;
            background:linear-gradient(45deg,var(--primary),var(--accent-2),var(--accent),var(--secondary),var(--primary));
            background-size:400% 400%; border-radius:calc(var(--radius)+2px); z-index:-1;
            opacity:0.22; animation:borderGlow 10s ease-in-out infinite;
        }
        @keyframes borderGlow { 0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;} }

        /* HEADER */
        .header { display:flex; justify-content:space-between; align-items:center; padding:4px 0 12px; flex-shrink:0; }
        .header-title { display:flex; align-items:center; gap:10px; }
        .header-title .logo {
            width:30px; height:30px; border-radius:10px;
            background:linear-gradient(135deg,var(--primary),var(--primary-dark));
            display:flex; align-items:center; justify-content:center;
            box-shadow:0 4px 14px rgba(124,77,255,0.4); flex-shrink:0;
        }
        .header-title .logo svg { width:16px; height:16px; color:white; }
        .header-title h1 {
            font-size:18px; font-weight:800; letter-spacing:-0.2px;
            background:linear-gradient(135deg,#fff,var(--primary-light));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .header-actions { display:flex; gap:6px; }
        .header-btn {
            background:var(--card-bg); border:1px solid var(--glass-border);
            color:var(--text-secondary); width:36px; height:36px; border-radius:50%;
            font-size:15px; cursor:pointer; transition:all 0.25s var(--ease-smooth);
            display:flex; align-items:center; justify-content:center; backdrop-filter:blur(10px);
        }
        .header-btn.active { color:var(--secondary); border-color:rgba(255,107,139,0.4); background:rgba(255,107,139,0.08); }
        .header-btn:active { transform:scale(0.85); }

        /* PORTADA CIRCULAR CON ALTO RELIEVE - AHORA MÁS PEQUEÑA */
        .album-wrapper {
            display:flex; justify-content:center; align-items:center;
            flex-shrink:0; padding:2px 0; position:relative;
        }
        .album-art {
            width:140px; height:140px; /* Más pequeña */
            border-radius:50%;
            overflow:hidden; position:relative;
            background:radial-gradient(circle at 30% 30%, #b388ff, #4a2aa8);
            box-shadow: 0 14px 44px rgba(91,47,209,0.5),
                        0 0 0 2px rgba(255,255,255,0.1),
                        inset 0 -4px 12px rgba(0,0,0,0.5),
                        inset 0 4px 12px rgba(255,255,255,0.3);
            flex-shrink:0;
            transition:transform 0.5s var(--ease-smooth);
            transform: perspective(800px) rotateX(4deg) rotateY(-2deg) scale(1.02);
        }
        .album-art:not(.spinning) { animation:idleBob 4s ease-in-out infinite; }
        @keyframes idleBob {
            0%,100% { transform: perspective(800px) rotateX(4deg) rotateY(-2deg) scale(1.02) translateY(0); }
            50% { transform: perspective(800px) rotateX(4deg) rotateY(-2deg) scale(1.04) translateY(-4px); }
        }
        .album-art img {
            width:100%; height:100%; object-fit:cover; display:block;
            border-radius:50%;
        }
        .album-art.spinning img { animation:spin 9s linear infinite; }
        @keyframes spin { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

        .album-art::after {
            content:''; position:absolute; inset:-4px;
            border-radius:50%;
            border:3px solid rgba(255,255,255,0.15);
            box-shadow: inset 0 8px 20px rgba(0,0,0,0.6),
                        0 8px 20px rgba(124,77,255,0.3);
            pointer-events:none;
        }
        .album-art .disc-pin {
            position:absolute; top:50%; left:50%;
            width:14px; height:14px; /* Más pequeño */
            border-radius:50%;
            background:radial-gradient(circle at 30% 30%, #ddd, #555);
            border:2px solid rgba(255,255,255,0.7);
            transform:translate(-50%,-50%);
            z-index:2; box-shadow:0 2px 8px rgba(0,0,0,0.5);
        }

        /* WAVES */
        .wave-container {
            display:flex; justify-content:center; align-items:center;
            gap:3px; height:22px; padding:2px 0; flex-shrink:0;
        }
        .wave {
            width:3px; height:5px;
            background:linear-gradient(180deg,var(--accent),var(--primary));
            border-radius:2px;
            animation:wave 0.85s ease-in-out infinite alternate;
            opacity:0; transition:opacity 0.3s ease;
        }
        .wave.active { opacity:0.85; }
        .wave:nth-child(1){ animation-delay:0s; height:6px; }
        .wave:nth-child(2){ animation-delay:0.12s; height:12px; }
        .wave:nth-child(3){ animation-delay:0.24s; height:18px; }
        .wave:nth-child(4){ animation-delay:0.12s; height:12px; }
        .wave:nth-child(5){ animation-delay:0s; height:6px; }
        @keyframes wave { 0%{transform:scaleY(0.35);} 100%{transform:scaleY(1);} }

        /* SONG INFO */
        .song-info { text-align:center; padding:2px 0 2px; flex-shrink:0; animation:songFade 0.4s var(--ease-smooth); }
        @keyframes songFade { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
        .song-title { font-size:17px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 8px; }
        .song-artist { font-size:12px; color:var(--text-secondary); margin-top:2px; display:flex; align-items:center; justify-content:center; gap:5px; flex-wrap:wrap; }
        .song-artist .tag {
            display:inline-flex; align-items:center; gap:3px; padding:1px 8px;
            border-radius:20px; background:var(--card-bg-strong);
            font-size:10px; font-weight:600;
        }
        .song-artist .tag.christian { color:var(--accent); }
        .song-artist .tag.own { color:var(--accent-2); }
        .favorite-btn {
            background:none; border:none; font-size:20px; cursor:pointer;
            transition:all 0.3s var(--ease-spring);
            display:flex; align-items:center; justify-content:center;
            margin:0 auto; padding:2px; flex-shrink:0;
            color:var(--text-secondary);
        }
        .favorite-btn.liked { color:var(--secondary); }
        .favorite-btn:active { transform:scale(0.7); }

        /* MODE SWITCH */
        .mode-switch {
            position:relative; display:flex; background:var(--card-bg);
            border:1px solid var(--glass-border); border-radius:18px;
            padding:4px; gap:2px; flex-shrink:0; margin:2px 0;
        }
        .mode-indicator {
            position:absolute; top:4px; bottom:4px; left:4px;
            width:calc(33.333% - 3.66px);
            background:linear-gradient(135deg,var(--primary),var(--primary-dark));
            border-radius:14px; box-shadow:0 4px 16px rgba(124,77,255,0.45);
            transition:transform 0.4s var(--ease-spring); z-index:1;
        }
        .mode-btn {
            position:relative; z-index:2; flex:1; background:none; border:none;
            color:var(--text-secondary); display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:3px;
            padding:7px 4px; border-radius:14px; font-size:10px;
            font-weight:700; letter-spacing:0.1px; cursor:pointer;
            transition:color 0.3s ease;
        }
        .mode-btn svg { width:16px; height:16px; transition:transform 0.3s var(--ease-spring); }
        .mode-btn.active { color:#fff; }
        .mode-btn.active svg { transform:scale(1.1); }
        .mode-btn:active svg { transform:scale(0.85); }

        /* CONTROLS */
        .controls {
            display:flex; justify-content:center; align-items:center;
            gap:14px; padding:2px 0; flex-shrink:0;
        }
        .controls button {
            background:var(--card-bg); border:1px solid var(--glass-border);
            color:var(--text-primary); width:44px; height:44px; border-radius:50%;
            font-size:16px; cursor:pointer; transition:all 0.25s var(--ease-smooth);
            display:flex; align-items:center; justify-content:center; backdrop-filter:blur(10px);
        }
        .controls button:active { transform:scale(0.85); }
        .controls .play-btn {
            width:56px; height:56px;
            background:linear-gradient(135deg,var(--primary),var(--primary-dark));
            border:none; font-size:20px;
            box-shadow:0 10px 28px rgba(124,77,255,0.4);
        }
        .controls .play-btn svg { margin-left:2px; }
        .controls .play-btn.is-playing svg { margin-left:0; }
        .controls .play-btn:active { transform:scale(0.9); box-shadow:0 5px 16px rgba(124,77,255,0.25); }

        /* PROGRESS */
        .progress-container { width:100%; padding:2px 0; flex-shrink:0; }
        .progress-bar {
            width:100%; height:4px; background:rgba(255,255,255,0.1);
            border-radius:3px; cursor:pointer; position:relative; touch-action:none;
        }
        .progress-fill {
            height:100%; background:linear-gradient(90deg,var(--primary),var(--accent));
            border-radius:3px; width:0%; transition:width 0.05s linear; position:relative;
        }
        .progress-fill::after {
            content:''; position:absolute; right:-6px; top:50%;
            transform:translateY(-50%);
            width:12px; height:12px; background:var(--accent); border-radius:50%;
            box-shadow:0 0 0 4px rgba(255,200,87,0.18);
            opacity:0; transition:opacity 0.2s ease;
        }
        .progress-bar:active .progress-fill::after { opacity:1; }
        .time-info { display:flex; justify-content:space-between; color:var(--text-secondary); font-size:9px; margin-top:2px; font-variant-numeric:tabular-nums; }

        /* EXTRAS BAR */
        .extras-bar { display:flex; justify-content:space-between; align-items:center; padding:2px 2px; flex-shrink:0; }
        .extras-bar .group { display:flex; align-items:center; gap:8px; }
        .extras-bar .group .icon-btn {
            background:none; border:none; color:var(--text-secondary);
            font-size:15px; cursor:pointer; transition:all 0.3s var(--ease-smooth);
            padding:3px; display:flex; align-items:center;
        }
        .extras-bar .group .icon-btn:active { transform:scale(0.8); }
        .extras-bar .group .icon-btn.is-active { color:var(--secondary); }
        .volume-slider {
            width:60px; height:3px; -webkit-appearance:none; appearance:none;
            background:rgba(255,255,255,0.15); border-radius:2px; outline:none;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance:none; width:10px; height:10px; border-radius:50%;
            background:var(--accent); cursor:pointer;
            box-shadow:0 0 0 4px rgba(255,200,87,0.15);
        }

        /* ACTION BUTTONS */
        .action-buttons { display:flex; gap:8px; justify-content:center; flex-shrink:0; padding:2px 0; flex-wrap:wrap; }
        .action-btn {
            background:var(--card-bg); border:1px solid var(--glass-border);
            color:var(--text-secondary); padding:8px 12px; border-radius:30px;
            font-size:11.5px; font-weight:600; cursor:pointer;
            transition:all 0.25s var(--ease-smooth); backdrop-filter:blur(10px);
            display:flex; align-items:center; justify-content:center; gap:6px;
            flex:1; min-width:80px; max-width:180px;
        }
        .action-btn:active { transform:scale(0.95); }
        .action-btn svg { width:14px; height:14px; }
        .action-btn .badge {
            background:var(--primary); color:white; border-radius:50%;
            width:17px; height:17px; font-size:9px; font-weight:700;
            display:flex; align-items:center; justify-content:center;
        }
        .action-btn.primary {
            background:linear-gradient(135deg,var(--primary),var(--primary-dark));
            color:white; border:none;
        }
        .action-btn.update-btn {
            background:linear-gradient(135deg,var(--accent-2),#2ba69a);
            color:white; border:none;
        }
        .action-btn.update-btn:disabled { opacity:0.55; cursor:not-allowed; }
        .spinner {
            display:inline-block; width:12px; height:12px;
            border:2px solid rgba(255,255,255,0.3); border-radius:50%;
            border-top-color:#fff; animation:rotate 0.8s linear infinite;
        }
        @keyframes rotate { to{transform:rotate(360deg);} }

        /* MODAL */
        .modal-overlay {
            position:fixed; inset:0;
            background:rgba(6,5,16,0.65); backdrop-filter:blur(18px);
            -webkit-backdrop-filter:blur(18px); z-index:1000;
            display:flex; align-items:flex-end; justify-content:center;
            opacity:0; visibility:hidden; transition:all 0.4s var(--ease-spring);
            padding:20px;
        }
        .modal-overlay.show { opacity:1; visibility:visible; }
        .modal {
            background:linear-gradient(160deg,rgba(30,24,74,0.96),rgba(15,12,36,0.98));
            backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px);
            border-radius:28px 28px 0 0; width:100%; max-width:440px;
            max-height:75vh; padding:20px 20px calc(20px + var(--safe-bottom));
            transform:translateY(100%); transition:transform 0.45s var(--ease-spring);
            border:1px solid var(--glass-border); border-bottom:none;
            display:flex; flex-direction:column;
        }
        .modal-overlay.show .modal { transform:translateY(0); }
        .modal-handle { width:40px; height:4px; background:rgba(255,255,255,0.2); border-radius:2px; margin:0 auto 16px; flex-shrink:0; }
        .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-shrink:0; }
        .modal-header h2 { font-size:17px; font-weight:700; display:flex; align-items:center; gap:8px; }
        .modal-header h2 svg { width:17px; height:17px; color:var(--primary-light); }
        .modal-header .close-btn {
            background:var(--card-bg); border:1px solid var(--glass-border);
            color:var(--text-secondary); width:34px; height:34px; border-radius:50%;
            cursor:pointer; transition:all 0.25s ease;
            display:flex; align-items:center; justify-content:center;
        }
        .modal-header .close-btn svg { width:15px; height:15px; }
        .modal-header .close-btn:active { transform:scale(0.85); }
        .modal-playlist { flex:1; overflow-y:auto; padding-right:4px; }
        .modal-playlist::-webkit-scrollbar { width:3px; }
        .modal-playlist::-webkit-scrollbar-track { background:rgba(255,255,255,0.05); border-radius:2px; }
        .modal-playlist::-webkit-scrollbar-thumb { background:var(--primary); border-radius:2px; }
        .modal-item {
            display:flex; align-items:center; padding:10px 12px;
            border-radius:14px; cursor:pointer; transition:all 0.25s var(--ease-smooth);
            margin-bottom:2px; gap:10px;
        }
        .modal-item:active { transform:scale(0.97); background:var(--card-bg); }
        .modal-item.active { background:rgba(124,77,255,0.16); border-left:3px solid var(--primary); }
        .modal-item .cat-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
        .modal-item .cat-dot.christian { background:var(--accent); }
        .modal-item .cat-dot.own { background:var(--accent-2); }
        .modal-item .info { flex:1; min-width:0; }
        .modal-item .info .title { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .modal-item .info .sub { font-size:10.5px; color:var(--text-secondary); opacity:0.75; margin-top:1px; }
        .modal-item .status-icon { color:var(--accent); flex-shrink:0; }
        .modal-item .status-icon svg { width:13px; height:13px; }
        .modal-item .fav-star { flex-shrink:0; color:var(--text-secondary); opacity:0.3; transition:all 0.3s ease; }
        .modal-item .fav-star svg { width:13px; height:13px; }
        .modal-item .fav-star.favorited { color:var(--secondary); opacity:1; }
        .modal-item .delete-btn { background:none; border:none; color:var(--secondary); cursor:pointer; padding:4px 6px; opacity:0.45; transition:all 0.25s ease; display:flex; }
        .modal-item .delete-btn svg { width:14px; height:14px; }
        .modal-item .delete-btn:active { opacity:1; transform:scale(0.8); }
        .modal-empty { text-align:center; color:var(--text-secondary); padding:40px 20px; font-size:13px; opacity:0.75; }
        .modal-empty svg { width:40px; height:40px; display:block; margin:0 auto 14px; color:var(--primary-light); opacity:0.6; }
        .modal-empty .sub { font-size:12px; opacity:0.7; margin-top:6px; }
        .storage-info { display:flex; align-items:center; justify-content:center; gap:6px; text-align:center; font-size:10px; color:var(--text-secondary); opacity:0.6; padding:8px 0 2px; flex-shrink:0; }
        .storage-info svg { width:11px; height:11px; }

        /* TOAST */
        .toast {
            position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(60px);
            background:rgba(10,8,24,0.92); backdrop-filter:blur(20px);
            padding:10px 20px; border-radius:14px; color:white; font-size:12.5px;
            font-weight:500; border:1px solid var(--glass-border);
            transition:all 0.5s var(--ease-spring); opacity:0; pointer-events:none;
            z-index:2000; max-width:85%; text-align:center; display:flex; align-items:center; gap:8px;
        }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .toast svg { width:14px; height:14px; flex-shrink:0; color:var(--accent); }

        /* RESPONSIVE */
        @media (max-width:420px) {
            .player-container { padding:14px 14px calc(14px + var(--safe-bottom)); }
            .album-art { width:120px; height:120px; }
            .header-title h1 { font-size:16px; }
            .controls button { width:40px; height:40px; font-size:15px; }
            .controls .play-btn { width:50px; height:50px; font-size:18px; }
            .song-title { font-size:15px; }
            .modal { padding:16px 16px calc(16px + var(--safe-bottom)); max-height:65vh; }
            .volume-slider { width:50px; }
            .action-btn { font-size:11px; padding:8px 10px; min-width:70px; }
        }
        @media (max-width:360px) {
            .album-art { width:100px; height:100px; }
            .controls button { width:36px; height:36px; font-size:14px; }
            .controls .play-btn { width:44px; height:44px; font-size:16px; }
            .song-title { font-size:13px; }
            .mode-btn { font-size:9px; }
        }
        @media (min-height:800px) { 
            .album-art { width:160px; height:160px; }
        }
        @media (max-height:640px) {
            .album-art { width:100px; height:100px; }
            .controls button { width:36px; height:36px; font-size:14px; }
            .controls .play-btn { width:44px; height:44px; font-size:16px; }
            .wave-container { height:14px; }
            .song-title { font-size:14px; }
            .header-title h1 { font-size:14px; }
            .action-btn { padding:6px 8px; font-size:10px; min-width:60px; }
            .mode-btn { padding:5px 3px; }
        }
        @media (prefers-reduced-motion:reduce) {
            *,*::before,*::after { animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
        }
    </style>
</head>
<body>

<div class="offline-badge" id="offlineBadge"></div>
<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-handle"></div>

        return `<svg class="icon${extraClass?' '+extraClass:''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;
    }

    // ============================================
    // LISTA DE IMÁGENES RANDOM PARA PORTADA
    // ============================================
    const PORTADAS = [
        'https://picsum.photos/seed/music1/400/400',
        'https://picsum.photos/seed/music2/400/400',
        'https://picsum.photos/seed/music3/400/400',
        'https://picsum.photos/seed/music4/400/400',
        'https://picsum.photos/seed/music5/400/400',
        'https://picsum.photos/seed/music6/400/400',
        'https://picsum.photos/seed/music7/400/400',
        'https://picsum.photos/seed/music8/400/400',
        'https://picsum.photos/seed/music9/400/400',
        'https://picsum.photos/seed/music10/400/400',
    ];

    function getRandomPortada() {
        return PORTADAS[Math.floor(Math.random() * PORTADAS.length)];
    }

    // ============================================
    // LISTAS DE CANCIONES ACTUALIZADAS
    // ============================================

    const TODAS = [...CRISTIANS, ...MIAS];

    // ============================================
    // GESTOR IndexedDB
    // ============================================
    class MusicDatabase {
        constructor() { this.dbName='MusicPlayerDB'; this.storeName='songs'; this.db=null; this.isReady=false; }
        async init() {
            return new Promise((resolve,reject)=>{
                const request=indexedDB.open(this.dbName,3);
                request.onupgradeneeded=(e)=>{
                    const db=e.target.result;
                    if(db.objectStoreNames.contains(this.storeName)) db.deleteObjectStore(this.storeName);
                    const store=db.createObjectStore(this.storeName,{keyPath:'id',autoIncrement:true});
                    store.createIndex('title','title',{unique:false});
                };
                request.onsuccess=(e)=>{ this.db=e.target.result; this.isReady=true; resolve(); };
                request.onerror=(e)=>reject(e.target.error);
            });
        }
        async addSong(data) {
            return new Promise((resolve,reject)=>{
                const tx=this.db.transaction([this.storeName],'readwrite');
                const store=tx.objectStore(this.storeName);
                const req=store.add(data);
                req.onsuccess=()=>resolve(req.result);
                req.onerror=()=>reject(req.error);
            });
        }
        async getAllSongs() {
            return new Promise((resolve,reject)=>{
                const tx=this.db.transaction([this.storeName],'readonly');
                const store=tx.objectStore(this.storeName);
                const req=store.getAll();
                req.onsuccess=()=>resolve(req.result||[]);
                req.onerror=()=>reject(req.error);
            });
        }
        async deleteSong(id) {
            return new Promise((resolve,reject)=>{
                const tx=this.db.transaction([this.storeName],'readwrite');
                const store=tx.objectStore(this.storeName);
                const req=store.delete(id);
                req.onsuccess=()=>resolve();
                req.onerror=()=>reject(req.error);
            });
        }
        async updateSong(id,data) {
            return new Promise((resolve,reject)=>{
                const tx=this.db.transaction([this.storeName],'readwrite');
                const store=tx.objectStore(this.storeName);
                const req=store.put({...data,id});
                req.onsuccess=()=>resolve();
                req.onerror=()=>reject(req.error);
            });
        }
        async getTotalSize() {
            const songs=await this.getAllSongs();
            let total=0; songs.forEach(s=>{ if(s.blob) total+=s.blob.size; });
            return total;
        }
        async clearAll() {
            return new Promise((resolve,reject)=>{
                const tx=this.db.transaction([this.storeName],'readwrite');
                const store=tx.objectStore(this.storeName);
                const req=store.clear();
                req.onsuccess=()=>resolve();
                req.onerror=()=>reject(req.error);
            });
        }
        async getSongCount() {
            const songs=await this.getAllSongs();
            return songs.length;
        }
    }

    // ============================================
    // REPRODUCTOR PRINCIPAL
    // ============================================
    class MusicPlayer {
        constructor() {
            this.db=new MusicDatabase();
            this.allSongs=[];
            this.playlist=[];
            this.currentIndex=0;
            this.currentMode='all';
            this.isPlaying=false;
            this.isShuffle=false;
            this.isRepeat=false;
            this.isDragging=false;
            this.currentSongLiked=false;
            this.shuffleHistory=[];
            this.isLoading=false;
            this.isUpdating=false;
            this.audio=new Audio();
            this.portadaActual = getRandomPortada();
            this.renderStaticIcons();
            this.initDOM();
            this.initEventListeners();
            this.initApp();
        }

        renderStaticIcons() {
            document.getElementById('offlineBadge').innerHTML=icon('wifiOff')+' Sin conexión — Modo offline';
            document.getElementById('logoIcon').innerHTML=icon('music');
            document.getElementById('modalTitleIcon').innerHTML=icon('list')+' Mi Biblioteca';
            document.getElementById('closeModalBtn').innerHTML=icon('x');
            document.getElementById('prevBtn').innerHTML=icon('prev');
            document.getElementById('nextBtn').innerHTML=icon('next');
            document.getElementById('shuffleBtn').innerHTML=icon('shuffle');
            document.getElementById('volumeIcon').innerHTML=icon('volume');
            document.getElementById('openPlaylistBtn').innerHTML=icon('list')+'<span>Biblioteca</span><span class="badge" id="playlistBadge">0</span>';
            document.getElementById('modeAllBtn').innerHTML=icon('infinity')+'<span>Todo</span>';
            document.getElementById('modeChristianBtn').innerHTML=icon('cross')+'<span>Cristiana</span>';
            document.getElementById('modeOwnBtn').innerHTML=icon('user')+'<span>Mías</span>';
            
            // ICONOS PARA LOS BOTONES DEL HEADER
            document.getElementById('themeBtn').innerHTML = icon('moon');
            document.getElementById('repeatBtn').innerHTML = icon('repeat');
            
            // ICONO PARA EL BOTÓN DE REPRODUCCIÓN (play)
            document.getElementById('playBtn').innerHTML = icon('play');
            
            // IMAGEN DE PORTADA RANDOM
            document.getElementById('albumImage').src = this.portadaActual;
            
            this.renderUpdateButtonIdle();
        }
        renderUpdateButtonIdle() {
            document.getElementById('updateBtn').innerHTML=icon('refresh')+'<span>Actualizar</span><span class="badge" id="updateBadge">0</span>';
        }

        initDOM() {
            this.dom={
                playBtn:document.getElementById('playBtn'),
                prevBtn:document.getElementById('prevBtn'),
                nextBtn:document.getElementById('nextBtn'),
                progressFill:document.getElementById('progressFill'),
                progressBar:document.getElementById('progressBar'),
                currentTime:document.getElementById('currentTime'),
                totalTime:document.getElementById('totalTime'),
                volumeControl:document.getElementById('volumeControl'),
                currentTitle:document.getElementById('currentSongTitle'),
                currentArtist:document.getElementById('currentSongArtist'),
                favoriteBtn:document.getElementById('favoriteBtn'),
                likeBtn:document.getElementById('likeBtn'),
                shuffleBtn:document.getElementById('shuffleBtn'),
                repeatBtn:document.getElementById('repeatBtn'),
                themeBtn:document.getElementById('themeBtn'),
                albumArt:document.getElementById('albumArt'),
                albumImage:document.getElementById('albumImage'),
                waves:document.querySelectorAll('.wave'),
                modalOverlay:document.getElementById('modalOverlay'),
                modalPlaylist:document.getElementById('modalPlaylist'),
                openPlaylistBtn:document.getElementById('openPlaylistBtn'),
                closeModalBtn:document.getElementById('closeModalBtn'),
                storageInfo:document.getElementById('storageInfo'),
                toast:document.getElementById('toast'),
                offlineBadge:document.getElementById('offlineBadge'),
                updateBtn:document.getElementById('updateBtn'),
                modeSwitch:document.getElementById('modeSwitch'),
                modeIndicator:document.getElementById('modeIndicator'),
                modeBtns:document.querySelectorAll('.mode-btn')
            };
        }

        initEventListeners() {
            this.dom.playBtn.addEventListener('click',()=>this.togglePlay());
            this.dom.prevBtn.addEventListener('click',()=>this.prevSong());
            this.dom.nextBtn.addEventListener('click',()=>this.nextSong());
            this.dom.favoriteBtn.addEventListener('click',()=>this.toggleFavorite());
            this.dom.likeBtn.addEventListener('click',()=>this.toggleFavorite());
            this.dom.shuffleBtn.addEventListener('click',()=>this.toggleShuffle());
            this.dom.repeatBtn.addEventListener('click',()=>this.toggleRepeat());
            this.dom.themeBtn.addEventListener('click',()=>this.toggleTheme());
            this.dom.volumeControl.addEventListener('input',(e)=>{ this.audio.volume=parseFloat(e.target.value); });
            this.audio.addEventListener('timeupdate',()=>this.updateProgress());
            this.dom.progressBar.addEventListener('mousedown',(e)=>this.startDrag(e));
            this.dom.progressBar.addEventListener('touchstart',(e)=>this.startDrag(e));
            document.addEventListener('mousemove',(e)=>this.drag(e));
            document.addEventListener('touchmove',(e)=>this.drag(e));
            document.addEventListener('mouseup',()=>this.endDrag());
            document.addEventListener('touchend',()=>this.endDrag());
            this.audio.addEventListener('ended',()=>this.onEnded());
            this.audio.addEventListener('error',()=>this.onError());
            document.addEventListener('keydown',(e)=>this.onKeyDown(e));
            this.dom.openPlaylistBtn.addEventListener('click',()=>this.openModal());
            this.dom.closeModalBtn.addEventListener('click',()=>this.closeModal());
            this.dom.modalOverlay.addEventListener('click',(e)=>{ if(e.target===this.dom.modalOverlay) this.closeModal(); });
            this.dom.updateBtn.addEventListener('click',()=>this.updateLibrary());
            this.dom.modeBtns.forEach(btn=>{
                btn.addEventListener('click',()=>this.playMode(btn.dataset.mode));
            });
            window.addEventListener('online',()=>this.updateOfflineStatus());
            window.addEventListener('offline',()=>this.updateOfflineStatus());
            this.updateOfflineStatus();
        }

        async initApp() {
            if(this.isLoading) return;
            this.isLoading=true;
            try {
                await this.db.init();
                const count=await this.db.getSongCount();
                if(count===0) {
                    this.dom.currentTitle.textContent='Cargando biblioteca...';
                    this.showToast('folderPlus','Cargando canciones...');
                    await this.loadPrecargedSongs();
                } else {
                    this.showToast('check',`${count} canciones cargadas`);
                }
                await this.loadPlaylist();
                this.checkForUpdates();
            } catch(e) {
                console.error(e);
                this.showToast('x','Error al cargar la biblioteca');
            } finally { this.isLoading=false; }
        }

        async updateLibrary() {
            if(this.isUpdating) return;
            if(!navigator.onLine) { this.showToast('wifiOff','Sin conexión, no se puede actualizar'); return; }
            this.isUpdating=true;
            this.dom.updateBtn.disabled=true;
            this.dom.updateBtn.innerHTML='<span class="spinner"></span><span>Actualizando...</span>';
            try {
                const currentSongs=await this.db.getAllSongs();
                const currentTitles=new Set(currentSongs.map(s=>s.title));
                let newSongs=0, alreadyExist=0, failed=0;
                for(const song of TODAS) {
                    if(currentTitles.has(song.title)) { alreadyExist++; continue; }
                    try {
                        const resp=await fetch(song.url);
                        if(!resp.ok){ failed++; continue; }
                        const blob=await resp.blob();
                        await this.db.addSong({
                            fileName:song.title+'.mp3',
                            title:song.title,
                            blob:blob,
                            liked:false,
                            category: CRISTIANS.some(c=>c.title===song.title) ? 'cristiana' : 'propia',
                            dateAdded:new Date().toISOString()
                        });
                        newSongs++;
                    } catch(e){ failed++; }
                }
                await this.loadPlaylist();
                let msg='Actualización completa';
                if(newSongs>0) msg+=`: ${newSongs} nuevas`;
                if(alreadyExist>0) msg+=`, ${alreadyExist} ya existían`;
                if(failed>0) msg+=`, ${failed} fallaron`;
                this.showToast('check',msg);
            } catch(e) {
                console.error(e);
                this.showToast('x','Error al actualizar la biblioteca');
            } finally {
                this.isUpdating=false;
                this.dom.updateBtn.disabled=false;
                this.renderUpdateButtonIdle();
                this.checkForUpdates();
            }
        }

        async checkForUpdates() {
            try {
                const currentSongs=await this.db.getAllSongs();
                const currentTitles=new Set(currentSongs.map(s=>s.title));
                let missing=0;
                for(const song of TODAS) {
                    if(!currentTitles.has(song.title)) missing++;
                }
                const badge=document.getElementById('updateBadge');
                if(badge) { badge.textContent=missing; badge.style.display=missing>0?'flex':'none'; }
                if(missing>0) this.showToast('refresh',`${missing} canciones nuevas disponibles`);
            } catch(e){ console.error(e); }
        }

        async loadPrecargedSongs() {
            let loaded=0, failed=0;
            const total=TODAS.length;
            for(const song of TODAS) {
                try {
                    const resp=await fetch(song.url);
                    if(!resp.ok){ failed++; continue; }
                    const blob=await resp.blob();
                    await this.db.addSong({
                        fileName:song.title+'.mp3',
                        title:song.title,
                        blob:blob,
                        liked:false,
                        category: CRISTIANS.some(c=>c.title===song.title) ? 'cristiana' : 'propia',
                        dateAdded:new Date().toISOString()
                    });
                    loaded++;
                } catch(e){ failed++; }
            }
            this.showToast('check',`${loaded} de ${total} canciones cargadas${failed>0?` (${failed} fallaron)`:''}`);
        }

        async loadPlaylist() {
            try {
                this.allSongs=await this.db.getAllSongs();
                const categoryByTitle=new Map(TODAS.map(s=>[s.title, CRISTIANS.some(c=>c.title===s.title)?'cristiana':'propia']));
                for(const s of this.allSongs) {
                    const correct=categoryByTitle.get(s.title)||s.category||'propia';
                    if(s.category!==correct) {
                        s.category=correct;
                        this.db.updateSong(s.id,s).catch(()=>{});
                    }
                }
                this.applyMode(this.currentMode,false);
                this.updatePlaylistUI();
                this.updateStorageInfo();
                if(this.playlist.length>0) {
                    this.currentIndex=0;
                    await this.loadSong(this.currentIndex);
                } else {
                    this.dom.currentTitle.textContent='Sin canciones disponibles';
                    this.dom.currentArtist.textContent='Conéctate y toca "Actualizar" para descargarlas';
                }
                this.checkForUpdates();
            } catch(e) { console.error(e); this.showToast('x','Error al cargar la biblioteca'); }
        }

        applyMode(mode, resetIndex=true) {
            this.currentMode=mode;
            if(mode==='christian') {
                this.playlist=this.allSongs.filter(s=>s.category==='cristiana');
            } else if(mode==='own') {
                this.playlist=this.allSongs.filter(s=>s.category==='propia');
            } else {
                this.playlist=this.allSongs.slice();
            }
            if(resetIndex) this.currentIndex=0;
            const order=['all','christian','own'];
            const idx=order.indexOf(mode);
            this.dom.modeIndicator.style.transform=`translateX(${idx*100}%)`;
            this.dom.modeBtns.forEach(btn=>btn.classList.toggle('active',btn.dataset.mode===mode));
        }

        playMode(mode) {
            this.applyMode(mode,true);
            if(this.playlist.length===0) {
                const label=mode==='christian'?'música cristiana':mode==='own'?'tus canciones':'canciones';
                this.showToast('x',`No hay ${label} en la biblioteca todavía`);
                return;
            }
            this.loadSong(this.currentIndex);
            this.isPlaying=true;
            this.audio.play().catch(()=>{ this.showToast('x','No se puede reproducir'); this.isPlaying=false; });
            this.dom.playBtn.innerHTML=icon('pause');
            this.dom.playBtn.classList.add('is-playing');
            this.updateWaves(true);
            this.dom.albumArt.classList.add('spinning');
            this.updatePlaylistUI();
        }

        async loadSong(index) {
            const song=this.playlist[index];
            if(!song) return;
            try {
                const url=URL.createObjectURL(song.blob);
                this.audio.src=url;
                this.audio.load();
                this.dom.currentTitle.textContent=song.title||song.fileName;
                const catTag=song.category==='cristiana'
                    ? `<span class="tag christian">${icon('cross')} Cristiana</span>`
                    : `<span class="tag own">${icon('user')} Mía</span>`;
                this.dom.currentArtist.innerHTML=`${index+1} de ${this.playlist.length} ${catTag}`;
                this.currentSongLiked=song.liked||false;
                this.updateFavoriteUI();
                // Cambiar imagen de portada por una random al cambiar de canción
                this.portadaActual = getRandomPortada();
                this.dom.albumImage.src = this.portadaActual;
                this.updateWaves(false);
                this.updatePlaylistUI();
                if(this.isPlaying) {
                    this.audio.play().catch(()=>{
                        this.showToast('x','Error al reproducir');
                        this.isPlaying=false;
                        this.dom.playBtn.innerHTML=icon('play');
                        this.dom.playBtn.classList.remove('is-playing');
                    });
                }
            } catch(e) { console.error(e); this.showToast('x','Error al cargar la canción'); }
        }

        togglePlay() {
            if(!this.playlist.length) { this.showToast('x','No hay canciones'); return; }
            if(this.audio.src===''||this.audio.src==='about:blank') {
                this.loadSong(this.currentIndex);
                setTimeout(()=>this.togglePlay(),300);
                return;
            }
            if(this.isPlaying) {
                this.audio.pause();
                this.dom.playBtn.innerHTML=icon('play');
                this.dom.playBtn.classList.remove('is-playing');
                this.isPlaying=false;
                this.updateWaves(false);
                this.dom.albumArt.classList.remove('spinning');
            } else {
                this.audio.play().catch(()=>this.showToast('x','No se puede reproducir'));
                this.dom.playBtn.innerHTML=icon('pause');
                this.dom.playBtn.classList.add('is-playing');
                this.isPlaying=true;
                this.updateWaves(true);
                this.dom.albumArt.classList.add('spinning');
            }
            this.updatePlaylistUI();
        }

        prevSong() {
            if(!this.playlist.length) return;
            if(this.isShuffle && this.shuffleHistory.length>0) {
                this.currentIndex=this.shuffleHistory.pop()||0;
            } else {
                this.currentIndex=(this.currentIndex-1+this.playlist.length)%this.playlist.length;
            }
            this.loadSong(this.currentIndex);
            if(this.isPlaying) this.audio.play().catch(()=>{});
            this.updatePlaylistUI();
        }

        nextSong() {
            if(!this.playlist.length) return;
            if(this.isShuffle) {
                let next;
                do { next=Math.floor(Math.random()*this.playlist.length); } while(next===this.currentIndex && this.playlist.length>1);
                this.shuffleHistory.push(this.currentIndex);
                this.currentIndex=next;
            } else {
                this.currentIndex=(this.currentIndex+1)%this.playlist.length;
            }
            this.loadSong(this.currentIndex);
            if(this.isPlaying) this.audio.play().catch(()=>{});
            this.updatePlaylistUI();
        }

        onEnded() {
            if(this.isRepeat) {
                this.audio.currentTime=0;
                this.audio.play().catch(()=>{});
                this.showToast('repeat','Repitiendo canción');
            } else {
                this.nextSong();
            }
        }
        onError() { this.showToast('x','Error al reproducir la canción'); }

        toggleFavorite() {
            if(!this.playlist.length||!this.playlist[this.currentIndex]) return;
            const song=this.playlist[this.currentIndex];
            song.liked=!song.liked;
            this.currentSongLiked=song.liked;
            const ref=this.allSongs.find(s=>s.id===song.id);
            if(ref) ref.liked=song.liked;
            this.db.updateSong(song.id,song).catch(err=>console.error(err));
            this.updateFavoriteUI();
            this.updatePlaylistUI();
            this.showToast('heart',song.liked?'Agregado a favoritos':'Eliminado de favoritos');
        }
        updateFavoriteUI() {
            const cls=this.currentSongLiked?'icon-filled':'';
            this.dom.favoriteBtn.innerHTML=icon('heart',cls);
            this.dom.favoriteBtn.classList.toggle('liked',this.currentSongLiked);
            this.dom.likeBtn.innerHTML=icon('heart',cls);
            this.dom.likeBtn.classList.toggle('is-active',this.currentSongLiked);
        }

        async deleteSong(songId) {
            const song=this.allSongs.find(s=>s.id===songId);
            if(!song) return;
            if(!confirm(`¿Eliminar "${song.title}" de la biblioteca?`)) return;
            try {
                await this.db.deleteSong(song.id);
                const wasCurrent=this.playlist[this.currentIndex]&&this.playlist[this.currentIndex].id===songId;
                this.allSongs=this.allSongs.filter(s=>s.id!==songId);
                this.applyMode(this.currentMode,false);
                this.playlist=this.playlist.filter(s=>s.id!==songId);
                if(this.playlist.length===0) {
                    this.currentIndex=0;
                    this.audio.src='';
                    this.dom.currentTitle.textContent='Sin canciones disponibles';
                    this.dom.currentArtist.textContent='Conéctate y toca "Actualizar" para descargarlas';
                    this.dom.playBtn.innerHTML=icon('play');
                    this.dom.playBtn.classList.remove('is-playing');
                    this.isPlaying=false;
                    this.updateWaves(false);
                    this.dom.albumArt.classList.remove('spinning');
                } else if(wasCurrent) {
                    this.currentIndex=Math.min(this.currentIndex,this.playlist.length-1);
                    await this.loadSong(this.currentIndex);
                }
                this.updatePlaylistUI();
                this.updateStorageInfo();
                this.showToast('trash',`"${song.title}" eliminada`);
            } catch(e) { console.error(e); this.showToast('x','Error al eliminar'); }
        }

        toggleShuffle() {
            this.isShuffle=!this.isShuffle;
            this.dom.shuffleBtn.classList.toggle('is-active',this.isShuffle);
            this.showToast('shuffle',this.isShuffle?'Aleatorio activado':'Aleatorio desactivado');
            if(this.isShuffle) this.shuffleHistory=[];
        }
        toggleRepeat() {
            this.isRepeat=!this.isRepeat;
            this.dom.repeatBtn.classList.toggle('active',this.isRepeat);
            this.showToast('repeat',this.isRepeat?'Repetir activado':'Repetir desactivado');
        }
        toggleTheme() {
            const isDark=document.documentElement.style.getPropertyValue('--bg-start')!=='#f5f3ff';
            const root=document.documentElement;
            if(isDark) {
                root.style.setProperty('--bg-start','#f5f3ff');
                root.style.setProperty('--bg-mid','#ede9fe');
                root.style.setProperty('--bg-end','#ddd6fe');
                root.style.setProperty('--text-primary','#1a1a2e');
                root.style.setProperty('--text-secondary','#5c5a7a');
                root.style.setProperty('--card-bg','rgba(255,255,255,0.65)');
                root.style.setProperty('--card-bg-strong','rgba(255,255,255,0.85)');
                this.dom.themeBtn.innerHTML=icon('sun');
                this.showToast('sun','Modo claro');
            } else {
                root.style.setProperty('--bg-start','#0b0918');
                root.style.setProperty('--bg-mid','#1a1440');
                root.style.setProperty('--bg-end','#140f2e');
                root.style.setProperty('--text-primary','#FFFFFF');
                root.style.setProperty('--text-secondary','#9C97B8');
                root.style.setProperty('--card-bg','rgba(255,255,255,0.055)');
                root.style.setProperty('--card-bg-strong','rgba(255,255,255,0.09)');
                this.dom.themeBtn.innerHTML=icon('moon');
                this.showToast('moon','Modo oscuro');
            }
        }

        updateProgress() {
            if(!this.isDragging && this.audio.duration) {
                const p=(this.audio.currentTime/this.audio.duration)*100;
                this.dom.progressFill.style.width=`${p}%`;
                this.dom.currentTime.textContent=this.formatTime(this.audio.currentTime);
                this.dom.totalTime.textContent=this.formatTime(this.audio.duration);
            }
        }
        startDrag(e) {
            if(!this.audio.duration) return;
            this.isDragging=true;
            const rect=this.dom.progressBar.getBoundingClientRect();
            const clientX=e.type==='touchstart'?e.touches[0].clientX:e.clientX;
            const x=Math.max(0,Math.min(1,(clientX-rect.left)/rect.width));
            this.audio.currentTime=x*this.audio.duration;
            this.dom.progressFill.style.width=`${x*100}%`;
        }
        drag(e) {
            if(!this.isDragging||!this.audio.duration) return;
            const rect=this.dom.progressBar.getBoundingClientRect();
            const clientX=e.type==='touchmove'?e.touches[0].clientX:e.clientX;
            let x=Math.max(0,Math.min(1,(clientX-rect.left)/rect.width));
            this.audio.currentTime=x*this.audio.duration;
            this.dom.progressFill.style.width=`${x*100}%`;
            this.dom.currentTime.textContent=this.formatTime(this.audio.currentTime);
        }
        endDrag() { this.isDragging=false; }

        updateWaves(active) { this.dom.waves.forEach(w=>w.classList.toggle('active',active)); }

        updatePlaylistUI() {
            this.dom.modalPlaylist.innerHTML='';
            if(this.allSongs.length===0) {
                this.dom.modalPlaylist.innerHTML=`
                    <div class="modal-empty">
                        ${icon('folderPlus')}
                        No hay canciones en tu biblioteca
                        <div class="sub">Conéctate a internet y toca "Actualizar" para descargarlas</div>
                    </div>
                `;
                const badge=document.getElementById('playlistBadge');
                if(badge) badge.textContent='0';
                return;
            }
            const currentSong=this.playlist[this.currentIndex];
            this.allSongs.forEach((song)=>{
                const isActive=currentSong&&song.id===currentSong.id;
                const div=document.createElement('div');
                div.className=`modal-item ${isActive?'active':''}`;
                div.innerHTML=`
                    <span class="cat-dot ${song.category==='cristiana'?'christian':'own'}"></span>
                    <div class="info">
                        <div class="title">${song.title||song.fileName}</div>
                        <div class="sub">${song.category==='cristiana'?'Cristiana':'Mía'} · ${song.liked?'★ Favorita · ':''}${this.formatSize(song.blob.size)}</div>
                    </div>
                    ${isActive&&this.isPlaying?`<span class="status-icon">${icon('volume')}</span>`:''}
                    <span class="fav-star ${song.liked?'favorited':''}">${icon('heart',song.liked?'icon-filled':'')}</span>
                    <button class="delete-btn" data-id="${song.id}">${icon('trash')}</button>
                `;
                div.addEventListener('click',(e)=>{
                    if(e.target.closest('.delete-btn')) return;
                    this.applyMode('all',false);
                    this.currentIndex=this.playlist.findIndex(s=>s.id===song.id);
                    this.loadSong(this.currentIndex);
                    this.isPlaying=true;
                    this.audio.play().catch(()=>{});
                    this.dom.playBtn.innerHTML=icon('pause');
                    this.dom.playBtn.classList.add('is-playing');
                    this.updateWaves(true);
                    this.dom.albumArt.classList.add('spinning');
                    this.updatePlaylistUI();
                    this.closeModal();
                });
                const deleteBtn=div.querySelector('.delete-btn');
                deleteBtn.addEventListener('click',(e)=>{
                    e.stopPropagation();
                    this.deleteSong(song.id);
                });
                this.dom.modalPlaylist.appendChild(div);
            });
            const badge=document.getElementById('playlistBadge');
            if(badge) badge.textContent=this.allSongs.length;
        }

        async updateStorageInfo() {
            try {
                const totalSize=await this.db.getTotalSize();
                this.dom.storageInfo.innerHTML=`${icon('disc')} ${this.allSongs.length} canciones · ${this.formatSize(totalSize)} usados`;
            } catch(e){ console.error(e); }
        }

        formatSize(bytes) {
            if(bytes<1024) return `${bytes} B`;
            if(bytes<1048576) return `${(bytes/1024).toFixed(1)} KB`;
            if(bytes<1073741824) return `${(bytes/1048576).toFixed(1)} MB`;
            return `${(bytes/1073741824).toFixed(1)} GB`;
        }
        formatTime(seconds) {
            if(isNaN(seconds)||!isFinite(seconds)||seconds<0) return '0:00';
            const m=Math.floor(seconds/60);
            const s=Math.floor(seconds%60);
            return `${m}:${String(s).padStart(2,'0')}`;
        }

        showToast(iconName,msg) {
            this.dom.toast.innerHTML=`${icon(iconName||'check')}<span>${msg}</span>`;
            this.dom.toast.classList.add('show');
            clearTimeout(this.dom.toast._timeout);
            this.dom.toast._timeout=setTimeout(()=>{ this.dom.toast.classList.remove('show'); },3000);
        }
        updateOfflineStatus() {
            if(!navigator.onLine) this.dom.offlineBadge.classList.add('show');
            else this.dom.offlineBadge.classList.remove('show');
        }
        onKeyDown(e) {
            if(e.target.tagName==='INPUT') return;
            if(e.key===' '||e.key==='Space'){ e.preventDefault(); this.togglePlay(); }
            if(e.key==='ArrowRight') this.nextSong();
            if(e.key==='ArrowLeft') this.prevSong();
            if(e.key==='Escape') this.closeModal();
        }
        openModal() { this.updatePlaylistUI(); this.dom.modalOverlay.classList.add('show'); document.body.style.overflow='hidden'; }
        closeModal() { this.dom.modalOverlay.classList.remove('show'); document.body.style.overflow=''; }
    }

    // ============================================
    // INICIALIZAR
    // ============================================
    const player = new MusicPlayer();
</script>
