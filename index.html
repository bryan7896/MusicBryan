<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mi Música — Reproductor Offline</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mi Música">
    <meta name="theme-color" content="#7E5EFF">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="offline-badge" id="offlineBadge"></div>
<div class="toast" id="toast"></div>

<!-- MINI MODAL: selector de Mix -->
<div class="mini-modal-overlay" id="mixModalOverlay">
    <div class="mini-modal">
        <div class="mini-modal-title">Elige tu mix</div>
        <div id="mixOptionsList"></div>
        <button class="mix-accept-btn" id="mixAcceptBtn">Aceptar</button>
    </div>
</div>

<!-- MINI MODAL: Configuración -->
<div class="mini-modal-overlay" id="settingsModalOverlay">
    <div class="mini-modal settings-modal">
        <div class="settings-modal-header">
            <button class="settings-back-btn" id="settingsBackBtn"></button>
            <div class="mini-modal-title" id="settingsModalTitle">Configuración</div>
            <button class="settings-close-btn" id="settingsCloseBtn"></button>
        </div>

        <div class="settings-view" id="settingsViewMenu">
            <button class="settings-menu-row" id="settingsGoThemes">
                <span class="smr-icon"></span>
                <span class="smr-label">Temas</span>
                <span class="smr-arrow"></span>
            </button>
            <button class="settings-menu-row" id="settingsGoDownloads">
                <span class="smr-icon"></span>
                <span class="smr-label">Descargas</span>
                <span class="smr-arrow"></span>
            </button>
            <button class="settings-menu-row" id="settingsGoAdd">
                <span class="smr-icon"></span>
                <span class="smr-label">Agregar</span>
                <span class="smr-arrow"></span>
            </button>
        </div>

        <div class="settings-view" id="settingsViewThemes" style="display:none;">
            <div class="theme-swatch-list" id="themeSwatchList"></div>
        </div>

        <div class="settings-view" id="settingsViewDownloads" style="display:none;">
            <div class="song-list-scroll settings-downloads-scroll" id="settingsDownloadsList"></div>
        </div>

        <div class="settings-view" id="settingsViewAdd" style="display:none;">
            <div class="add-suggestion-box">
                <textarea id="addSuggestionInput" class="add-suggestion-input" rows="4" placeholder="Escribe una URL o el nombre de la canción que quieres sugerir..."></textarea>
                <button class="mix-accept-btn" id="addSuggestionSubmit">Enviar sugerencia</button>
            </div>
        </div>
    </div>
</div>

<div class="app-shell" id="appShell">

    <div class="top-section" id="topSection">
        <div class="falling-circles" id="fallingCircles"></div>

        <div class="header">
            <button class="header-chip" id="openPlaylistBtn" title="Biblioteca"></button>
            <span class="header-label" id="headerLabel">Descargas</span>
            <button class="header-chip" id="openSettingsBtn" title="Configuración"></button>
        </div>

        <div class="now-playing-view" id="nowPlayingView">
            <button class="category-badge" id="categoryBadgeBtn">
                <span class="cb-select-icon" id="cbSelectIcon"></span>
                <span class="cb-label" id="categoryBadgeLabel">Elige tu mix</span>
                <span class="cb-cat-icon" id="categoryBadgeIcon"></span>
            </button>

            <div class="album-row">
                <button class="side-btn like-btn" id="favoriteBtn" title="Me gusta"></button>
                <div class="album-art" id="albumArt">
                    <img src="" alt="Portada" id="albumImage">
                </div>
                <button class="side-btn download-btn" id="quickDownloadBtn" title="Descargar"></button>
            </div>

            <div class="song-title" id="currentSongTitle">Cargando música...</div>

            <div class="wave-container" id="waveContainer">
                <div class="wave"></div><div class="wave"></div><div class="wave"></div><div class="wave"></div><div class="wave"></div>
            </div>
        </div>
    </div>

    <div class="bottom-section" id="bottomSection">
        <div class="progress-container">
            <div class="time-info">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="mini-toggles">
            <button class="mini-toggle-btn" id="repeatBtn" title="Repetir"></button>
            <button class="mini-toggle-btn" id="shuffleBtn" title="Aleatorio"></button>
        </div>

        <div class="song-list-view" id="songListView">
            <div class="list-search-wrap">
                <input type="text" id="listSearchInput" class="list-search-input" placeholder="Buscar canción...">
            </div>
            <div class="list-tabs">
                <button class="list-tab active" id="tabAll">Todas</button>
                <button class="list-tab" id="tabTop">Tu TOP</button>
            </div>
            <div class="song-list-scroll" id="songListScroll"></div>
        </div>
    </div>

    <div class="floating-controls" id="floatingControls">
        <button id="prevBtn" title="Anterior"></button>
        <button class="play-btn" id="playBtn" title="Reproducir/Pausar"></button>
        <button id="nextBtn" title="Siguiente"></button>
    </div>

</div>

<script src="songs.js"></script>
<script src="icons.js"></script>
<script src="catalog.js"></script>
<script src="db.js"></script>
<script src="effects.js"></script>
<script src="player-core.js"></script>
<script src="player-ui.js"></script>
<script src="app.js"></script>
</body>
</html>
