<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mi Música — Reproductor Offline</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mi Música">
    <meta name="theme-color" content="#0b0918">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="aurora"><span></span><span></span><span></span><span></span></div>
<div class="grain"></div>
<div class="floaties" id="floaties"></div>

<div class="offline-badge" id="offlineBadge"></div>
<div class="toast" id="toast"></div>

<!-- MODAL: Biblioteca / TOP / Mix -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-handle"></div>
        <div class="modal-header">
            <h2 id="modalTitleIcon">Mi Biblioteca</h2>
            <button class="close-btn" id="closeModalBtn"></button>
        </div>
        <div class="modal-playlist" id="modalPlaylist"></div>
        <div class="storage-info" id="storageInfo"></div>
    </div>
</div>

<!-- PÁGINA DESCARGADAS: pantalla completa, tema propio -->
<div class="downloads-page" id="downloadsPage">
    <div class="downloads-inner">
        <div class="downloads-header">
            <button class="downloads-back" id="downloadsBackBtn"></button>
            <div class="downloads-title">
                <h2>Descargadas</h2>
                <p>Disponibles sin conexión</p>
            </div>
        </div>
        <div class="downloads-body" id="downloadsBody"></div>
    </div>
</div>

<div class="player-container">

    <div class="header">
        <div class="header-title">
            <span class="logo" id="logoIcon"></span>
            <div class="titles">
                <span class="eyebrow">Reproduciendo</span>
                <h1>Mi Música</h1>
            </div>
        </div>
        <div class="header-actions">
            <button class="header-btn" id="topBtn" title="Tu TOP"></button>
            <button class="header-btn" id="repeatBtn" title="Repetir"></button>
        </div>
    </div>

    <div class="album-wrapper">
        <div class="album-art" id="albumArt">
            <img src="" alt="Portada" id="albumImage">
        </div>
    </div>

    <div class="wave-container" id="waveContainer">
        <div class="wave" id="wave1"></div>
        <div class="wave" id="wave2"></div>
        <div class="wave" id="wave3"></div>
        <div class="wave" id="wave4"></div>
        <div class="wave" id="wave5"></div>
    </div>

    <div class="song-info">
        <div class="song-title" id="currentSongTitle">Cargando música...</div>
        <div class="song-artist" id="currentSongArtist">Preparando tu biblioteca</div>
    </div>

    <button class="favorite-btn" id="favoriteBtn"></button>

    <div class="mode-switch" id="modeSwitch">
        <div class="mode-indicator" id="modeIndicator"></div>
        <button class="mode-btn active" id="modeMixBtn" data-mode="mix"></button>
        <button class="mode-btn" id="modeChristianBtn" data-mode="cristiana"></button>
        <button class="mode-btn" id="modeOwnBtn" data-mode="propia"></button>
        <button class="mode-btn" id="modeGymBtn" data-mode="gym"></button>
    </div>

    <div class="controls">
        <button id="prevBtn" title="Anterior"></button>
        <button class="play-btn" id="playBtn" title="Reproducir/Pausar"></button>
        <button id="nextBtn" title="Siguiente"></button>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-info">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
        </div>
    </div>

    <div class="extras-bar">
        <button class="icon-btn" id="shuffleBtn" title="Aleatorio"></button>
        <button class="icon-btn" id="likeBtn" title="Me gusta"></button>
    </div>

    <div class="action-buttons">
        <button class="action-btn primary" id="openPlaylistBtn"></button>
        <button class="action-btn downloads" id="openDownloadsBtn"></button>
    </div>

</div>

<script src="songs.js"></script>
<script src="js/icons.js"></script>
<script src="js/catalog.js"></script>
<script src="js/db.js"></script>
<script src="js/player-core.js"></script>
<script src="js/player-ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
